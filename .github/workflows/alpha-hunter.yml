name: Alpha Hunter Market System

on:
  schedule:
    - cron: "3 */4 * * *"
  workflow_dispatch:

jobs:
  validate-market-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall main.py src dashboard validation

      - name: Validate deterministic Market System contracts
        env:
          GITHUB_ACTIONS: "true"
          TELEGRAM_ENABLED: "false"
          TELEGRAM_HEALTHCHECK_ENABLED: "false"
          TELEGRAM_REPORTS_ENABLED: "false"
        run: python -m validation.run_market_system_validation
